<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="50%" stop-color="#0b3c2c" />
      <stop offset="100%" stop-color="#041a13" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.35" />

  <!-- Glow effect circle -->
  <circle cx="256" cy="220" r="140" fill="#00D26A" opacity="0.08" filter="url(#glow)" />

  <!-- Shop Canopy & Store Outline -->
  <g transform="translate(106, 90)">
    <!-- Roof Awning -->
    <path d="M 10 90 L 290 90 L 270 30 L 30 30 Z" fill="url(#neonGrad)" />
    <!-- Scalloped Awning Flaps -->
    <path d="M 10 90 Q 30 115 50 90 Q 70 115 90 90 Q 110 115 130 90 Q 150 115 170 90 Q 190 115 210 90 Q 230 115 250 90 Q 270 115 290 90" fill="url(#neonGrad)" />
    
    <!-- Canopy Stripes -->
    <path d="M 50 30 L 40 90 Q 55 105 70 90 L 75 30 Z" fill="#06281e" opacity="0.25" />
    <path d="M 110 30 L 105 90 Q 120 105 135 90 L 135 30 Z" fill="#06281e" opacity="0.25" />
    <path d="M 170 30 L 170 90 Q 185 105 200 90 L 195 30 Z" fill="#06281e" opacity="0.25" />
    <path d="M 230 30 L 235 90 Q 250 105 265 90 L 255 30 Z" fill="#06281e" opacity="0.25" />

    <!-- Store Base Walls -->
    <rect x="35" y="110" width="230" height="150" rx="18" fill="#ffffff" opacity="0.95" />
    
    <!-- Store Door -->
    <rect x="115" y="150" width="70" height="110" rx="10" fill="url(#bgGrad)" />

    <!-- Shop Window Left -->
    <rect x="55" y="145" width="45" height="55" rx="8" fill="url(#skyGrad)" opacity="0.85" />
    <!-- Shop Window Right -->
    <rect x="200" y="145" width="45" height="55" rx="8" fill="url(#skyGrad)" opacity="0.85" />

    <!-- Floating Badge / Verified Checkmark / Coin -->
    <circle cx="240" cy="110" r="32" fill="url(#neonGrad)" filter="url(#glow)" />
    <!-- Checkmark / Star in Badge -->
    <path d="M 228 110 L 236 118 L 254 100" fill="none" stroke="#06281e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography in Icon -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    DukaanDost
  </text>
  <text x="256" y="455" font-family="'Noto Nastaliq Urdu', system-ui, sans-serif" font-weight="700" font-size="28" fill="#00D26A" text-anchor="middle">
    دکان دوست • سمارٹ کھاتہ
  </text>
</svg>
